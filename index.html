<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Bíblia CEP">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3d2b1f">
  <meta name="msapplication-TileColor" content="#3d2b1f">
  <title>Bíblia CEP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <meta name="apple-mobile-web-app-title" content="Bíblia CEP">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f5efe0;--bg2:#ede5cf;--bg3:#e2d8c0;
      --ink:#1b120a;--ink2:#3b2716;--ink3:#6f4a2b;
      --gold:#7a5400;--gold-lt:#b88718;--red:#7d1414;
      --border:rgba(90,55,20,0.18);--shadow:rgba(42,26,14,0.12);
      --radius:6px;--font-body:'EB Garamond',Georgia,serif;
      --font-ui:'Cormorant SC',serif;--sidebar-w:280px;--topbar-h:52px;--safe-top:env(safe-area-inset-top,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--reader-font-scale:1;
    }
    [data-theme="dark"]{
      --bg:#1a1108;--bg2:#251a0c;--bg3:#2f2010;
      --ink:#f0e8d0;--ink2:#c8a870;--ink3:#8a7050;
      --gold:#c49a2a;--gold-lt:#e8c060;--red:#c05050;
      --border:rgba(200,168,112,0.15);--shadow:rgba(0,0,0,0.4);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7;transition:background .3s,color .3s}
    #app{display:flex;height:100vh}

    #topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--topbar-h) + var(--safe-top));background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:var(--safe-top) calc(12px + var(--safe-right)) 0 calc(12px + var(--safe-left));z-index:400;box-shadow:0 2px 8px var(--shadow)}
    #topbar-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
    #topbar-logo{width:34px;height:34px;border-radius:8px;flex-shrink:0;cursor:pointer}
    #topbar h1{font-family:var(--font-ui);font-size:1rem;font-weight:500;letter-spacing:.06em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #topbar-title{flex:1;text-align:left!important}
    .topbar-btn{background:none;border:none;cursor:pointer;color:var(--ink2);padding:6px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;min-width:40px;min-height:40px;touch-action:manipulation}
    .topbar-btn[hidden]{display:none}
    .topbar-btn:hover{background:var(--bg3)}
    .topbar-btn svg{width:22px;height:22px}
    #font-btn{font-family:var(--font-ui);font-size:.82rem;letter-spacing:.03em;min-width:44px}
    #menu-btn{order:0}
    #topbar-brand{order:1}
    #font-btn,#search-btn,#theme-btn{order:2}

    #sidebar{width:var(--sidebar-w);height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;overflow:hidden}
    #sidebar-header{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
    #sidebar-brand{display:flex;align-items:center;gap:12px}
    #sidebar-logo{width:42px;height:42px;border-radius:9px;flex-shrink:0;cursor:pointer}
    #sidebar-header h2{font-family:var(--font-ui);font-size:1.1rem;letter-spacing:.1em;color:var(--ink);margin-bottom:2px}
    #sidebar-header p{font-size:.78rem;color:var(--ink3);font-style:italic}
    #book-list{flex:1;overflow-y:auto;padding:6px 0}

    .random-menu{margin:16px 12px 8px}
    .random-menu-toggle{width:100%;min-height:46px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--ink2);display:grid;grid-template-columns:24px 1fr 16px;align-items:center;gap:8px;padding:7px 11px;text-align:left;cursor:pointer;font-family:var(--font-ui);font-size:.82rem;letter-spacing:.04em;transition:background .15s,border-color .15s}
    .random-menu-toggle:hover{background:var(--bg3);border-color:var(--gold)}
    .random-menu-toggle svg{width:18px;height:18px;color:var(--gold)}
    .random-menu-toggle .chevron{text-align:right}
    .random-menu.open .random-menu-toggle .chevron{transform:rotate(90deg)}
    .random-menu-options{display:none;gap:6px;padding-top:8px}
    .random-menu.open .random-menu-options{display:grid}
    .random-menu-choice{width:100%;min-height:44px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--ink2);padding:7px 10px;font-family:var(--font-body);font-size:.86rem;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
    .random-menu-choice:hover{background:var(--gold-lt);border-color:var(--gold);color:var(--ink)}

    .testament-item{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;cursor:pointer;font-family:var(--font-ui);font-size:.92rem;letter-spacing:.09em;color:var(--ink);transition:background .15s;border-bottom:1px solid var(--border);user-select:none;text-transform:uppercase}
    .testament-item:hover{background:var(--bg3)}
    .testament-item.open .chevron{transform:rotate(90deg)}
    .testament-body{display:none;padding:4px 0 8px}
    .testament-body.open{display:block}
    .canon-group{margin:3px 0}
    .group-item{display:flex;align-items:center;justify-content:space-between;padding:7px 18px 7px 28px;cursor:pointer;font-family:var(--font-ui);font-size:.78rem;letter-spacing:.08em;color:var(--gold);transition:background .15s;user-select:none;text-transform:uppercase}
    .group-item:hover{background:var(--bg3)}
    .group-item.open .chevron{transform:rotate(90deg)}
    .group-body{display:none}
    .group-body.open{display:block}

    .book-item{display:flex;align-items:center;justify-content:space-between;padding:9px 18px 9px 40px;cursor:pointer;font-family:var(--font-ui);font-size:.9rem;letter-spacing:.04em;color:var(--ink2);transition:background .15s;border-left:3px solid transparent;user-select:none}
    .book-item:hover{background:var(--bg3)}
    .book-item.active{border-left-color:var(--gold);color:var(--ink);background:var(--bg3)}
    .book-item.unavailable{opacity:.58;cursor:default}
    .book-item.unavailable:hover{background:transparent}
    .book-status{font-size:.68rem;color:var(--ink3);font-family:var(--font-body);font-style:italic;letter-spacing:0;text-transform:none;white-space:nowrap}
    .book-meta{display:flex;align-items:center;gap:8px}
    .badge{font-size:.68rem;color:var(--ink3);font-family:var(--font-body)}
    .chevron{font-size:.7rem;color:var(--ink3);transition:transform .2s;display:inline-block}
    .book-item.open .chevron{transform:rotate(90deg)}

    .chapter-grid{display:none;grid-template-columns:repeat(6,1fr);gap:3px;padding:6px 14px 10px;background:var(--bg);border-bottom:1px solid var(--border)}
    .chapter-grid.open{display:grid}
    .book-intro{display:none;width:calc(100% - 28px);min-height:44px;margin:6px 14px 2px;border:1px solid var(--border);border-radius:5px;background:var(--bg2);color:var(--ink2);grid-template-columns:24px 1fr 18px;align-items:center;gap:7px;padding:6px 10px;text-align:left;cursor:pointer;font-family:var(--font-ui);font-size:.8rem;letter-spacing:.03em;transition:background .15s,border-color .15s}
    .book-intro.open{display:grid}
    .book-intro:hover{background:var(--gold-lt);border-color:var(--gold);color:var(--ink)}
    .book-intro svg{width:18px;height:18px;color:var(--gold)}
    .book-intro .chevron{text-align:right}
    .ch-btn{background:none;border:1px solid var(--border);border-radius:3px;padding:4px 2px;font-family:var(--font-ui);font-size:.78rem;color:var(--ink3);cursor:pointer;transition:all .15s;text-align:center}
    .ch-btn:hover{background:var(--bg3);color:var(--ink)}
    .ch-btn.active{background:var(--gold);border-color:var(--gold);color:#fff}

    #main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding-top:calc(var(--topbar-h) + var(--safe-top))}
    #reader{flex:1;overflow-y:auto;padding:28px 32px 80px;max-width:none;margin:0;width:100%;background:var(--bg)}
    .home-screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);padding:48px 16px 104px;position:relative}
    .home-title{font-family:var(--font-ui);font-size:1.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
    .home-subtitle{font-size:1.15rem;line-height:1.45;color:var(--ink3);font-style:italic}
    .app-version{position:absolute;bottom:38px;left:0;right:0;text-align:center;font-family:var(--font-ui);font-size:.72rem;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
    .report-error{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.82rem;color:var(--ink3)}
    .desktop-version{position:absolute;bottom:-10px;left:0;right:0;text-align:center;font-size:.82rem;color:var(--ink3)}
    .report-error a,.desktop-version a{color:var(--ink3);text-decoration:none;border-bottom:1px dotted var(--ink3)}
    .report-error a:hover,.desktop-version a:hover{color:var(--gold);border-bottom-color:var(--gold)}

    #verses-container{max-width:840px;margin:0 auto;transition:max-width .2s ease;display:block}
    #text-column{min-width:0}

    .chapter-nav{display:flex;align-items:center;justify-content:space-between;margin:0 auto 24px;gap:8px;max-width:880px;width:100%}
    .chapter-nav-bottom{margin-top:28px;margin-bottom:0}
    .nav-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 14px;font-family:var(--font-ui);font-size:.8rem;color:var(--ink3);cursor:pointer;transition:all .15s;letter-spacing:.04em;white-space:nowrap}
    .nav-btn:hover{background:var(--bg3);color:var(--ink)}
    .nav-btn:disabled{opacity:.3;cursor:default}
    #chapter-title-block{text-align:center;flex:1}
    #chapter-heading{font-family:var(--font-ui);font-size:1.35rem;letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
    #book-heading{font-size:.78rem;color:var(--gold);font-family:var(--font-ui);letter-spacing:.1em;margin-top:2px;text-transform:uppercase}

    .verse-block{margin-bottom:10px;padding:4px 0;border-radius:3px;transition:background .15s}
    .verse-block:hover{background:rgba(237,229,207,.45)}
    .verse-block.random-passage{background:color-mix(in srgb,var(--gold) 14%,var(--bg))}
    .verse-block.selected{background:rgba(122,84,0,.12)}
    .verse-num{cursor:pointer;border-radius:999px;padding:5px 6px;min-width:24px;text-align:center;transition:background .15s,color .15s}
    .verse-block.selected .verse-num{background:var(--gold);color:#fff}
    #selection-bar{position:fixed;left:calc(var(--sidebar-w) + 16px);right:16px;bottom:18px;background:var(--bg2);border:1px solid var(--border);box-shadow:0 4px 18px var(--shadow);border-radius:999px;padding:8px 10px;display:none;align-items:center;justify-content:center;gap:8px;z-index:220}
    #selection-bar.open{display:flex}
    #selection-count{font-family:var(--font-ui);font-size:.78rem;letter-spacing:.05em;color:var(--ink2);padding:0 8px;white-space:nowrap}
    .selection-btn{background:none;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-family:var(--font-ui);font-size:.76rem;color:var(--ink2);cursor:pointer;letter-spacing:.04em}
    .selection-btn:hover{background:var(--bg3)}

    .verse-layout{display:grid;grid-template-columns:92px minmax(0,1fr);column-gap:14px;align-items:start}
    .verse-rail{display:flex;flex-direction:row-reverse;align-items:center;justify-content:flex-end;gap:7px;min-height:1.85em;padding-top:.25em}
    .verse-num{font-family:var(--font-ui);font-size:.68rem;color:var(--gold-lt);line-height:1;letter-spacing:.03em;user-select:none}
    .verse-main{min-width:0}
    .verse-text{font-size:calc(1.1rem * var(--reader-font-scale,1));line-height:1.85}
    @media (min-width:769px){
      .verse-text{font-weight:500;letter-spacing:.012em}
    }
    .note-hit{position:relative;display:inline-grid;place-items:center;width:28px;height:32px;margin:-5px 0 -5px 1px;padding:0;border:0;background:transparent;vertical-align:middle;cursor:pointer;touch-action:manipulation}
    .note-hit::before{content:'';position:absolute;width:44px;height:44px}
    .note-chip{display:grid;place-items:center;min-width:22px;height:21px;padding:0 4px;border:1.25px solid var(--red);border-radius:4px;background:rgba(125,20,20,.06);color:var(--red);font-family:var(--font-ui);font-size:.72rem;font-weight:600;line-height:1;letter-spacing:0;transition:transform .12s,background .12s,color .12s}
    .note-hit:hover .note-chip,.note-hit:focus-visible .note-chip,.note-hit.selected .note-chip{background:var(--red);color:var(--bg);transform:translateY(-1px)}
    .note-hit:focus-visible{outline:2px solid var(--gold-lt);outline-offset:1px;border-radius:6px}
    .pericope{margin:24px 0 10px 106px;color:var(--ink2);font-family:var(--font-ui);font-size:.93rem;font-weight:600;line-height:1.4;letter-spacing:.04em}
    .verse-block.omitted .verse-text{color:var(--ink3);font-size:calc(.94rem * var(--reader-font-scale,1));font-style:italic}

    #note-overlay{position:fixed;inset:0;z-index:800;background:rgba(20,12,6,.52);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
    #note-overlay.open{opacity:1;visibility:visible}
    #note-sheet{position:absolute;left:50%;bottom:0;width:min(720px,100%);max-height:min(78dvh,760px);display:flex;flex-direction:column;transform:translate(-50%,105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);background:var(--bg2);color:var(--ink);border:1px solid var(--border);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -8px 34px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
    #note-overlay.open #note-sheet{transform:translate(-50%,0)}
    .note-sheet-handle{width:44px;height:4px;margin:8px auto 2px;border-radius:4px;background:var(--ink3);opacity:.45}
    .note-sheet-header{display:flex;align-items:center;gap:12px;padding:8px 14px 11px 20px;border-bottom:1px solid var(--border)}
    .note-sheet-title{min-width:0;flex:1}
    .note-sheet-title strong{display:block;color:var(--red);font-family:var(--font-ui);font-size:.9rem;font-weight:600;line-height:1.25;letter-spacing:.06em}
    .note-sheet-title span{display:block;margin-top:2px;color:var(--ink3);font-size:.78rem}
    #note-sheet-body{overflow:auto;padding:18px 20px 16px;overscroll-behavior:contain;white-space:pre-line;font-size:1rem;line-height:1.7}
    .note-sheet-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px 14px;border-top:1px solid var(--border)}
    .note-action-btn{min-height:44px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink2);font-family:var(--font-ui);font-size:.78rem;letter-spacing:.04em;cursor:pointer}
    .note-action-btn:hover,.note-action-btn:focus-visible,.note-action-btn.active{background:var(--gold);border-color:var(--gold);color:#fff;outline:none}
    body.note-open{overflow:hidden}
    .introduction{max-width:840px;margin:0 auto}
    .introduction>h2{text-align:center;font-family:var(--font-ui);font-size:1.5rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);margin:0 0 24px}
    .introduction-section{margin-bottom:28px}
    .introduction-section h3{font-family:var(--font-ui);font-size:1.02rem;line-height:1.35;letter-spacing:.04em;color:var(--gold);margin:0 0 10px}
    .introduction-section p{margin:.7em 0}

    .verse-tools{display:flex;flex-direction:row;align-items:center;gap:5px;opacity:0;pointer-events:none;transition:opacity .15s ease}
    .verse-block:hover .verse-tools,.verse-block:focus-within .verse-tools{opacity:1;pointer-events:auto}
    .verse-tool-btn{width:22px;height:22px;padding:0;border:0;background:transparent;border-radius:50%;font-family:var(--font-ui);font-size:.76rem;line-height:1;color:var(--ink3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
    .verse-tool-btn:hover{background:var(--bg3);color:var(--ink)}
    .verse-tool-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

    .side-panel{position:fixed;top:calc(var(--topbar-h) + var(--safe-top));right:0;bottom:0;height:calc(100vh - var(--topbar-h) - var(--safe-top));height:calc(100dvh - var(--topbar-h) - var(--safe-top));width:min(380px,100vw);background:var(--bg2);border-left:1px solid var(--border);box-shadow:-4px 0 20px var(--shadow);z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
    .side-panel.open{transform:translateX(0)}
    .panel-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .panel-header input{min-width:0}
    .panel-header h3{font-family:var(--font-ui);font-size:1rem;letter-spacing:.08em;flex:1}
    #search-input{flex:1;background:var(--bg)!important;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-family:var(--font-body);font-size:16px;color:var(--ink)!important;-webkit-text-fill-color:var(--ink);caret-color:var(--ink);appearance:none;-webkit-appearance:none;min-height:42px}
    #search-input:focus{outline:none;border-color:var(--gold)}
    #search-input::placeholder{color:var(--ink3);opacity:1}
    #search-options{padding:12px 16px;border-bottom:1px solid var(--border)}
    #search-scope{display:flex;gap:6px;padding:3px;background:var(--bg3);border-radius:999px}
    .search-scope-btn{flex:1;border:0;border-radius:999px;padding:7px 10px;background:transparent;color:var(--ink2);font-family:var(--font-ui);font-size:.76rem;letter-spacing:.03em;cursor:pointer}
    .search-scope-btn.active{background:var(--bg2);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
    #search-scope-book[hidden]{display:none}
    #search-warning{margin:10px 2px 0;color:var(--red);font-family:var(--font-ui);font-size:.76rem;line-height:1.45}
    #search-warning[hidden]{display:none}
    #search-results{flex:1;overflow-y:auto;padding:8px 0}
    .result-item{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
    .result-item:hover{background:var(--bg3)}
    .result-ref{font-family:var(--font-ui);font-size:.78rem;color:var(--gold);display:block;margin-bottom:3px}
    .result-snippet{font-size:.9rem;line-height:1.5;color:var(--ink2)}
    .result-snippet mark{background:transparent;color:var(--red);font-weight:600}
    .panel-empty{padding:32px 16px;text-align:center;color:var(--ink3);font-style:italic;font-size:.95rem}

    #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150}
    #overlay.open{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

    #splash{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);opacity:1;visibility:visible;transition:opacity .28s ease,visibility 0s linear .28s}
    #splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .splash-content{text-align:center}
    .splash-logo{width:88px;height:88px;border-radius:20px;box-shadow:0 8px 24px var(--shadow);margin-bottom:22px}
    .splash-title{font-family:var(--font-ui);font-size:1.7rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
    .splash-subtitle{margin-top:6px;font-size:1rem;line-height:1.4;color:var(--ink3);font-style:italic}
    .splash-loading{margin-top:24px;font-family:var(--font-ui);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

    @media(max-width:700px){
      #sidebar{position:fixed;top:calc(var(--topbar-h) + var(--safe-top));bottom:0;left:0;height:calc(100vh - var(--topbar-h) - var(--safe-top));height:calc(100dvh - var(--topbar-h) - var(--safe-top));transform:translateX(-100%);box-shadow:4px 0 20px var(--shadow);z-index:250}
      #sidebar.open{transform:translateX(0)}
      #topbar h1{font-family:var(--font-ui);font-size:.94rem;font-weight:400;letter-spacing:.06em;line-height:1.1}
      #reader{padding:20px 16px 80px}
      .introduction{padding-top:16px}
      #verses-container{max-width:100%;display:block}
      .verse-layout{grid-template-columns:28px minmax(0,1fr);column-gap:10px}

      .verse-rail{flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}
      .verse-tools{flex-direction:column}
      .verse-tools{opacity:1;pointer-events:auto}
      .verse-tool-btn{width:24px;height:24px;font-size:.78rem}
      .pericope{margin-left:38px}
      #font-btn{display:flex}
      #search-panel .panel-header{padding-left:calc(16px + var(--safe-left));padding-right:calc(12px + var(--safe-right))}
      #selection-bar{left:12px;right:12px;bottom:14px;flex-wrap:wrap;border-radius:18px}
      #selection-count{width:100%;text-align:center}
      #update-banner{left:12px;right:12px;bottom:14px;flex-wrap:wrap;border-radius:18px;text-align:center}
    }
    @media(min-width:701px){
      #topbar{left:var(--sidebar-w)}
      #topbar-logo{display:none}
      #menu-btn{display:none}
      #font-btn{display:none}
      #note-sheet{bottom:24px;border-bottom:1px solid var(--border);border-radius:14px}
    }
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

    #update-banner{position:fixed;left:calc(var(--sidebar-w) + 16px);right:16px;bottom:18px;background:var(--bg2);border:1px solid var(--border);box-shadow:0 4px 18px var(--shadow);border-radius:999px;padding:8px 10px;display:none;align-items:center;justify-content:center;gap:10px;z-index:500;font-family:var(--font-ui);font-size:.8rem;color:var(--ink2);letter-spacing:.04em}
    #update-banner.open{display:flex}
    #update-now-btn{background:var(--gold);border:1px solid var(--gold);border-radius:999px;color:#fff;padding:5px 12px;font-family:var(--font-ui);font-size:.76rem;cursor:pointer;letter-spacing:.04em}
    #update-now-btn:hover{background:var(--gold-lt)}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 20px;border-radius:20px;font-size:.85rem;font-family:var(--font-ui);letter-spacing:.05em;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
    #toast.show{opacity:1}
  </style>
</head>
<body>

<div id="splash" role="status" aria-live="polite" aria-label="A carregar a Bíblia CEP">
  <div class="splash-content">
    <img class="splash-logo" src="icons/icon-192.png" alt="">
    <div class="splash-title">Bíblia Católica</div>
    <div class="splash-subtitle">Conferência Episcopal Portuguesa</div>
    <div class="splash-loading">A carregar…</div>
  </div>
</div>

<div id="topbar">
  <button class="topbar-btn" id="menu-btn" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div id="topbar-brand">
    <img src="icons/icon-192.png" alt="Bíblia CEP" id="topbar-logo">
    <h1 id="topbar-title">Bíblia CEP</h1>
  </div>
  <button class="topbar-btn" id="font-btn" title="Tamanho do texto" aria-label="Alterar tamanho do texto">A/A+</button>
  <button class="topbar-btn" id="search-btn" title="Pesquisar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>
  <button class="topbar-btn" id="theme-btn" title="Tema">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

<div id="overlay"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-brand">
        <img src="icons/icon-192.png" alt="Bíblia CEP" id="sidebar-logo">

<div id="search-panel" class="side-panel">
  <div class="panel-header">
    <input id="search-input" type="search" placeholder="Pesquisar palavras ou frases…" autocomplete="off">
    <button class="topbar-btn" id="search-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

    <div id="search-scope" role="group" aria-label="Âmbito da pesquisa">
      <button class="search-scope-btn" id="search-scope-book" type="button">Neste livro</button>
      <button class="search-scope-btn" id="search-scope-all" type="button">Toda a Bíblia</button>

      </button>

<div id="update-banner" role="status" aria-live="polite">
  <span>Nova versão disponível</span>
  <button id="update-now-btn" type="button">Atualizar</button>
</div>

<div id="toast"></div>

<script>
'use strict';
const APP_VERSION='5.51';
const APP_COMMIT_DATE='outubro 2026';
const state={books:[],currentBook:null,currentChapter:null,menuOpen:{testament:'',groups:{},book:'',random:false},selectedVerses:new Map(),fontScale:Number(localStorage.getItem('biblia-font-scale')||'1'),searchScope:'all',noteItems:new Map(),noteCounter:0,lastNoteFocus:null,activeNote:null};
applyFontScale();
function $(id){return document.getElementById(id)}
function toast(msg,dur=2200){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur)}
function applyFontScale(){document.documentElement.style.setProperty('--reader-font-scale', state.fontScale || 1)}
function reportErrorHref(){return `mailto:h.varios@gmail.com?subject=${encodeURIComponent('Erro - Bíblia CEP v.'+APP_VERSION)}`}
let refreshingForUpdate=false;
function showUpdateBanner(worker){
  const bar=$('update-banner');
  const btn=$('update-now-btn');
  if(!bar||!btn)return;
  bar.classList.add('open');
  btn.onclick=()=>{
    if(worker)worker.postMessage({type:'SKIP_WAITING'});
    else location.reload();
  };
}
function setupServiceWorkerUpdates(){
  if(!('serviceWorker'in navigator))return;
  navigator.serviceWorker.register(`./sw.js?v=${APP_VERSION}`).then(reg=>{
    if(reg.waiting)showUpdateBanner(reg.waiting);
    reg.addEventListener('updatefound',()=>{
      const worker=reg.installing;
      if(!worker)return;
      worker.addEventListener('statechange',()=>{
        if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdateBanner(worker);
      });
    });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshingForUpdate)return;
    refreshingForUpdate=true;
    location.reload();
  });
}
setupServiceWorkerUpdates();


const CANON=[
  {id:'AT',label:'Antigo Testamento',groups:[
    {id:'pentateuco',label:'Pentateuco',books:['Génesis','Êxodo','Levítico','Números','Deuteronómio']},
    {id:'historicos',label:'Históricos',books:['Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crónicas','2 Crónicas','Esdras','Neemias','Tobite','Judite','Ester','1 Macabeus','2 Macabeus']},
    {id:'sapienciais',label:'Sapienciais',books:['Job','Salmos','Provérbios','Eclesiastes','Cântico dos Cânticos','Sabedoria','Eclesiástico']},
    {id:'profeticos',label:'Proféticos',books:['Isaías','Jeremias','Lamentações','Baruc','Ezequiel','Daniel','Oseias','Joel','Amós','Abdias','Jonas','Miqueias','Naum','Habacuc','Sofonias','Ageu','Zacarias','Malaquias']}
  ]},
  {id:'NT',label:'Novo Testamento',groups:[
    {id:'evangelhos',label:'Evangelhos',books:['Mateus','Marcos','Lucas','João']},
    {id:'atos',label:'Atos',books:['Atos dos Apóstolos']},
    {id:'cartas-paulinas',label:'Cartas Paulinas',books:['Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filémon','Carta aos Hebreus']},
    {id:'cartas-catolicas',label:'Cartas Católicas',books:['Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas']},
    {id:'apocalipse',label:'Apocalipse',books:['Apocalipse']}
  ]}
];

function normBookName(name){return String(name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
const BOOK_ALIASES={
  'atos dos apostolos':['actos dos apostolos','atos','actos'],
  'cantico dos canticos':['cantico','canticos','cantares'],
  'eclesiastes':['coelet','qohelet'],
  'coelet':['eclesiastes','qohelet'],
  'eclesiastico':['siracida','ben sira'],
  'tobite':['tobias'],
  'tobias':['tobite'],
  '1 samuel':['i samuel','primeiro samuel'],
  '2 samuel':['ii samuel','segundo samuel'],
  '1 reis':['i reis','primeiro reis'],
  '2 reis':['ii reis','segundo reis'],
  '1 cronicas':['i cronicas','primeiro cronicas'],
  '2 cronicas':['ii cronicas','segundo cronicas'],
  '1 corintios':['i corintios','primeira corintios'],
  '2 corintios':['ii corintios','segunda corintios'],
  '1 tessalonicenses':['i tessalonicenses','primeira tessalonicenses'],
  '2 tessalonicenses':['ii tessalonicenses','segunda tessalonicenses'],
  '1 timoteo':['i timoteo','primeira timoteo'],
  '2 timoteo':['ii timoteo','segunda timoteo'],
  '1 pedro':['i pedro','primeira pedro'],
  '2 pedro':['ii pedro','segunda pedro'],
  '1 joao':['i joao','primeira joao'],
  '2 joao':['ii joao','segunda joao'],
  '3 joao':['iii joao','terceira joao']
};
function canonicalBookToken(name){
  return normBookName(name).replace(/^evangelho de /,'').replace(/^(sao|santo|santa) /,'');
}
function findBookByName(name){
  const wanted=canonicalBookToken(name);
  const variants=[wanted,`evangelho de ${wanted}`,...(BOOK_ALIASES[wanted]||[])].map(canonicalBookToken);
  return state.books.find(b=>{
    const actual=canonicalBookToken(b.book);
    return variants.includes(actual);
  });
}
function getBookChapterRefs(book){
  if(!book)return [];
  if(Array.isArray(book.chapters)&&book.chapters.length)return book.chapters;
  const count=Number(book.chaptersCount||book.chapterCount||0);
  return count>0?Array.from({length:count},(_,i)=>({chapter:i+1})):[];
}
function bookHasContent(book){return !!(book&&book.available!==false&&(book.file||bookIsLoaded(book))&&getBookChapterRefs(book).length)}
function bookIsLoaded(book){return !!(book&&Array.isArray(book.chapters)&&book.chapters.some(ch=>Array.isArray(ch.verses)))}
function currentTestamentId(){for(const testament of CANON){for(const group of testament.groups){if(group.books.some(name=>findBookByName(name)===state.currentBook))return testament.id}}return ''}
function currentGroupId(){for(const testament of CANON){for(const group of testament.groups){if(group.books.some(name=>findBookByName(name)===state.currentBook))return group.id}}return ''}
function selectBookMenuGroup(book){
  for(const testament of CANON){
    for(const group of testament.groups){
      if(group.books.some(name=>findBookByName(name)===book)){
        state.menuOpen.testament=testament.id;
        state.menuOpen.groups={[group.id]:true};
        return;
      }
    }
  }
}

async function loadData(){
  const res=await fetch(`./data/books-index.json?v=${APP_VERSION}`, {cache:'no-store'});
  if(!res.ok)throw new Error(`Não foi possível carregar o índice dos livros (${res.status})`);
  const data=await res.json();
  state.books=data.books||[];
  renderSidebar();
  renderHome();
}

async function loadBook(book){
  if(!book)throw new Error('Livro inválido');
  if(bookIsLoaded(book))return book;
  if(!book.file)throw new Error(`Livro sem ficheiro associado: ${book.book}`);
  const res=await fetch(`./data/${book.file}?v=${APP_VERSION}`, {cache:'no-store'});
  if(!res.ok)throw new Error(`Não foi possível carregar ${book.book} (${res.status})`);
  const data=await res.json();
  const meta={id:book.id,file:book.file,available:book.available};
  Object.assign(book,data,meta);
  return book;
}

async function ensureAllBooksLoaded(){
  for(const book of state.books){
    if(bookHasContent(book)&&!bookIsLoaded(book))await loadBook(book);
  }
}


function renderHome(){
  closeNote(false);
  clearVerseSelection(false);
  state.currentBook=null;
  state.currentChapter=null;
  state.menuOpen.testament='';
  state.menuOpen.groups={};
  state.menuOpen.book='';
  $('topbar-title').textContent='Bíblia CEP';
  const reader=$('reader');
  reader.removeAttribute('style');
  reader.innerHTML=`<section class="home-screen">
    <div>
      <div class="home-title">Bíblia Católica</div>
      <div class="home-subtitle">tradução da<br>Conferência Episcopal Portuguesa</div>
    </div>
    <div class="app-version">v. ${APP_VERSION} · ${APP_COMMIT_DATE}</div>
    <div class="report-error">Erros devem ser reportados para <a href="${reportErrorHref()}">h.varios@gmail.com</a></div>
    <div class="desktop-version">Versão desktop em <a href="https://hvarios.github.io/biblia-cep/">https://hvarios.github.io/biblia-cep/</a></div>
  </section>`;
}

function renderSidebar(){
  const list=$('book-list');
  list.innerHTML='';
  CANON.forEach(testament=>{
    const tOpen=state.menuOpen.testament===testament.id;
    const tWrap=document.createElement('div');
    const tItem=document.createElement('div');
    tItem.className='testament-item'+(tOpen?' open':'');
    tItem.innerHTML=`<span>${testament.label}</span><span class="chevron">›</span>`;
    tItem.addEventListener('click',()=>toggleTestament(testament.id));
    const tBody=document.createElement('div');
    tBody.className='testament-body'+(tOpen?' open':'');
    tBody.id=`testament-${testament.id}`;

    testament.groups.forEach(group=>{
      const gOpen=!!state.menuOpen.groups[group.id];
      const gWrap=document.createElement('div');
      gWrap.className='canon-group';
      const gItem=document.createElement('div');
      gItem.className='group-item'+(gOpen?' open':'');
      gItem.innerHTML=`<span>${group.label}</span><span class="chevron">›</span>`;
      gItem.addEventListener('click',()=>toggleGroup(group.id));
      const gBody=document.createElement('div');
      gBody.className='group-body'+(gOpen?' open':'');
      gBody.id=`group-${group.id}`;

      group.books.forEach(bookName=>{
        const book=findBookByName(bookName);
        const available=bookHasContent(book);
        const isCurrent=book&&state.currentBook===book;
        const isOpen=book&&state.menuOpen.book===book.book;
        const sec=document.createElement('div');
        const item=document.createElement('div');
        item.className='book-item'+(isCurrent?' active':'')+(isOpen?' open':'')+(available?'':' unavailable');
        item.dataset.bookName=available?book.book:bookName;
        item.innerHTML=available
          ? `<div class="book-meta"><span>${book.book}</span><span class="badge">${getBookChapterRefs(book).length} cap.</span></div><span class="chevron">›</span>`
          : `<div class="book-meta"><span>${bookName}</span></div><span class="book-status">em tradução</span>`;
        item.addEventListener('click',()=>available?toggleGrid(book.book):toast('Livro ainda em tradução'));
        sec.appendChild(item);

        if(available){
          if(book.introduction){
            const intro=document.createElement('button');
            intro.type='button';
            intro.className='book-intro'+(isOpen?' open':'');
            intro.setAttribute('aria-label',`Abrir introdução de ${book.book}`);
            intro.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6"/><path d="M12 7h.01"/></svg><span>Introdução</span><span class="chevron">›</span>`;
            intro.addEventListener('click',e=>{e.stopPropagation();openBookIntroduction(book)});
            sec.appendChild(intro);
          }
          const grid=document.createElement('div');
          grid.className='chapter-grid'+(isOpen?' open':'');
          grid.id=`grid-${bookKey(book.book)}`;
          getBookChapterRefs(book).forEach(ch=>{
            const btn=document.createElement('button');
            btn.className='ch-btn'+(state.currentBook===book&&state.currentChapter&&state.currentChapter.chapter===ch.chapter?' active':'');
            btn.textContent=ch.chapter;
            btn.addEventListener('click',e=>{e.stopPropagation();openChapter(book,ch)});
            grid.appendChild(btn);
          });
          sec.appendChild(grid);
        }
        gBody.appendChild(sec);
      });

      gWrap.appendChild(gItem);gWrap.appendChild(gBody);tBody.appendChild(gWrap);
    });

    tWrap.appendChild(tItem);tWrap.appendChild(tBody);list.appendChild(tWrap);
  });

  const random=document.createElement('section');
  random.className='random-menu'+(state.menuOpen.random?' open':'');
  random.innerHTML=`<button class="random-menu-toggle" type="button" aria-expanded="${state.menuOpen.random}" aria-controls="random-menu-options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg><span>Passagem aleatória</span><span class="chevron" aria-hidden="true">›</span></button><div class="random-menu-options" id="random-menu-options"><button class="random-menu-choice" type="button" data-scope="all">Toda a Bíblia</button><button class="random-menu-choice" type="button" data-scope="AT">No AT</button><button class="random-menu-choice" type="button" data-scope="NT">No NT</button></div>`;
  const randomToggle=random.querySelector('.random-menu-toggle');
  randomToggle.addEventListener('click',()=>{
    state.menuOpen.random=!state.menuOpen.random;
    random.classList.toggle('open',state.menuOpen.random);
    randomToggle.setAttribute('aria-expanded',String(state.menuOpen.random));
  });
  random.querySelectorAll('.random-menu-choice').forEach(button=>button.addEventListener('click',()=>openRandomPassage(button.dataset.scope)));
  list.appendChild(random);
}

function bookKey(name){return normBookName(name).replace(/ /g,'-')}
function toggleTestament(id){
  state.menuOpen.random=false;
  state.menuOpen.testament=state.menuOpen.testament===id?'':id;
  renderSidebar();
}
function toggleGroup(id){
  state.menuOpen.random=false;
  state.menuOpen.groups[id]=!state.menuOpen.groups[id];
  renderSidebar();
}
async function toggleGrid(bookName){
  state.menuOpen.random=false;
  const book=state.books.find(item=>item.book===bookName);if(!book)return;
  const opening=state.menuOpen.book!==bookName;
  state.menuOpen.book=opening?bookName:'';
  if(opening){
    try{
      await loadBook(book);
      state.menuOpen.book=book.book;
      selectBookMenuGroup(book);
    }catch(err){state.menuOpen.book='';toast(err.message||'Erro ao carregar livro')}
  }
  renderSidebar();
}


async function openChapter(book,chapterRef){
  try{
    state.menuOpen.random=false;
    await loadBook(book);
    const chapter=book.chapters.find(c=>Number(c.chapter)===Number(chapterRef.chapter));
    if(!chapter)throw new Error(`Capítulo não encontrado: ${book.book} ${chapterRef.chapter}`);
    state.currentBook=book;state.currentChapter=chapter;
    selectBookMenuGroup(book);
    state.menuOpen.book=book.book;
    $('topbar-title').textContent=`${book.book} ${chapter.chapter}`;
    renderSidebar();renderChapter(book,chapter);
    if(window.innerWidth<=700){$('sidebar').classList.remove('open');$('overlay').classList.remove('open')}
    $('reader').scrollTop=0;
  }catch(err){toast(err.message||'Erro ao carregar livro');}
}

async function prevChapter(){
  const book=state.currentBook;
  const idx=book.chapters.indexOf(state.currentChapter);
  if(idx>0)return openChapter(book,book.chapters[idx-1]);
  const bi=state.books.indexOf(book);
  for(let i=bi-1;i>=0;i--){
    const p=state.books[i];
    if(bookHasContent(p)){await loadBook(p);return openChapter(p,p.chapters[p.chapters.length-1]);}
  }
}
async function nextChapter(){
  const book=state.currentBook;
  const idx=book.chapters.indexOf(state.currentChapter);
  if(idx<book.chapters.length-1)return openChapter(book,book.chapters[idx+1]);
  const bi=state.books.indexOf(book);
  for(let i=bi+1;i<state.books.length;i++){
    const n=state.books[i];
    if(bookHasContent(n)){await loadBook(n);return openChapter(n,n.chapters[0]);}
  }
}
function hasPrev(){const book=state.currentBook;if(!book||!state.currentChapter)return false;const idx=book.chapters.indexOf(state.currentChapter);if(idx>0)return true;const bi=state.books.indexOf(book);return state.books.slice(0,bi).some(bookHasContent)}
function hasNext(){const book=state.currentBook;if(!book||!state.currentChapter)return false;const idx=book.chapters.indexOf(state.currentChapter);if(idx<book.chapters.length-1)return true;const bi=state.books.indexOf(book);return state.books.slice(bi+1).some(bookHasContent)}

function renderChapter(book,chapter){
  closeNote(false);
  state.noteItems.clear();state.noteCounter=0;
  applyFontScale();
  const reader=$('reader');
  reader.removeAttribute('style');
  reader.innerHTML=`
    <div class="chapter-nav">
      <button class="nav-btn" onclick="prevChapter()" ${hasPrev()?'':'disabled'}>‹ Anterior</button>
      <div id="chapter-title-block">
        <div id="book-heading">${book.book.toUpperCase()}</div>
        <div id="chapter-heading">Capítulo ${chapter.chapter}</div>
      </div>
      <button class="nav-btn" onclick="nextChapter()" ${hasNext()?'':'disabled'}>Seguinte ›</button>
    </div>
    
	<div id="verses-container">
		<div id="text-column"></div>
	</div>
	
    <div class="chapter-nav chapter-nav-bottom">
      <button class="nav-btn" onclick="prevChapter()" ${hasPrev()?'':'disabled'}>‹ Anterior</button>
      <div id="chapter-title-block">
        <div id="book-heading">${book.book.toUpperCase()}</div>
        <div id="chapter-heading">Capítulo ${chapter.chapter}</div>
      </div>
      <button class="nav-btn" onclick="nextChapter()" ${hasNext()?'':'disabled'}>Seguinte ›</button>
    </div>`;
  
	const container=$('verses-container');
	const textColumn=$('text-column');
  const headings=new Map();
  (chapter.headings||[]).forEach(heading=>{
    const before=Number(heading.before_verse)||1;
    if(!headings.has(before))headings.set(before,[]);
    headings.get(before).push(heading);
  });

  chapter.verses.forEach(verse=>{
    (headings.get(Number(verse.verse))||[]).forEach(heading=>{
      const title=document.createElement('h2');title.className='pericope';
      title.innerHTML=renderAnnotatedText(heading,`${book.book} ${chapter.chapter} · título antes do versículo ${verse.verse}`,{book:book.book,chapter:chapter.chapter,verse:verse.verse});
      textColumn.appendChild(title);
    });
    const block=document.createElement('div');
    const key=selectionKey(book.book,chapter.chapter,verse.verse);
    block.className='verse-block'+(verse.omitted?' omitted':'');block.dataset.verse=verse.verse;block.dataset.book=book.book;block.dataset.chapter=chapter.chapter;block.dataset.text=verse.text;block.dataset.key=key;
    const txt=`<span class="verse-text">${verse.omitted?'Versículo omitido nesta edição.':renderAnnotatedText(verse,`${book.book} ${chapter.chapter},${verse.verse}`,{book:book.book,chapter:chapter.chapter,verse:verse.verse})}</span>`;
    const tools=verse.omitted?'':`<div class="verse-tools">
      <button class="verse-tool-btn" title="Copiar" aria-label="Copiar versículo" onclick="copyV('${ea(book.book)}',${chapter.chapter},${verse.verse},'${ea(verse.text)}')"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M5 16H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
      <button class="verse-tool-btn" title="Partilhar" aria-label="Partilhar versículo" onclick="shareV('${ea(book.book)}',${chapter.chapter},${verse.verse},'${ea(verse.text)}')"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 10.8l6.8-4.1"></path><path d="M8.6 13.2l6.8 4.1"></path></svg></button>
    </div>`;
    const numberAction=verse.omitted?'':`onclick="toggleVerseSelection(this.closest('.verse-block'))"`;
    block.innerHTML=`<div class="verse-layout"><div class="verse-rail"><span class="verse-num" title="${verse.omitted?'Versículo omitido':'Selecionar versículo'}" ${numberAction}>${verse.verse}</span>${tools}</div><div class="verse-main">${txt}</div></div>`;
    if(state.selectedVerses.has(selectionKey(book.book,chapter.chapter,verse.verse)))block.classList.add('selected');
    textColumn.appendChild(block);
  });
  container.querySelectorAll('.note-hit').forEach(button=>button.addEventListener('click',()=>openNote(button.dataset.noteKey,button)));
}

function registerNote(ref,text,context,meta){
  const key=`note-${++state.noteCounter}`;
  const note={type:'note',ref:String(ref),text:String(text||''),context,...meta};
  note.selectionKey=`note|${note.book}|${note.chapter}|${note.verse}|${note.ref}`;
  state.noteItems.set(key,note);return key;
}
function visibleNoteRef(ref){return String(ref).replace(/^n/i,'')}
function noteButton(ref,text,context,meta){
  const refLabel=visibleNoteRef(ref);
  const key=registerNote(ref,text,context,meta);
  const selected=state.selectedVerses.has(state.noteItems.get(key).selectionKey)?' selected':'';
  return`<button class="note-hit${selected}" type="button" data-note-key="${key}" aria-label="Abrir nota ${esc(refLabel)}"><span class="note-chip">${esc(refLabel)}</span></button>`;
}
function renderAnnotatedText(item,context,meta){
  const text=String(item.text||'');
  const positions=Array.isArray(item.note_positions)?[...item.note_positions].sort((a,b)=>Number(a.offset)-Number(b.offset)):[];
  if(positions.length){
    let html='';let cursor=0;
    positions.forEach(position=>{
      const offset=Math.max(cursor,Math.min(Number(position.offset)||0,text.length));const ref=String(position.ref);
      html+=esc(text.slice(cursor,offset))+noteButton(ref,item.notes?.[ref],context,meta);cursor=offset;
    });
    return html+esc(text.slice(cursor));
  }
  let html=esc(text);
  if(item.note_refs&&item.notes)item.note_refs.forEach(ref=>{html+=noteButton(ref,item.notes[ref],context,meta)});
  return html;
}
function openNote(key,source){
  const note=state.noteItems.get(key);if(!note)return;
  state.lastNoteFocus=source||null;state.activeNote=note;
  $('note-sheet-heading').textContent=`Nota ${visibleNoteRef(note.ref)}`;$('note-sheet-context').textContent=note.context;$('note-sheet-body').textContent=note.text||'Nota sem texto.';
  updateNoteSelectionButton();$('note-overlay').classList.add('open');$('note-overlay').setAttribute('aria-hidden','false');document.body.classList.add('note-open');$('note-sheet-close').focus({preventScroll:true});
}
function closeNote(restoreFocus=true){
  const noteOverlay=$('note-overlay');if(!noteOverlay)return;
  noteOverlay.classList.remove('open');noteOverlay.setAttribute('aria-hidden','true');document.body.classList.remove('note-open');
  if(restoreFocus&&state.lastNoteFocus)state.lastNoteFocus.focus({preventScroll:true});state.lastNoteFocus=null;state.activeNote=null;
}
function updateNoteSelectionButton(){
  const selected=state.activeNote&&state.selectedVerses.has(state.activeNote.selectionKey);
  $('note-select-btn').textContent=selected?'Remover':'Selecionar';$('note-select-btn').classList.toggle('active',!!selected);
}
function toggleActiveNoteSelection(){
  const note=state.activeNote;if(!note)return;
  if(state.selectedVerses.has(note.selectionKey))state.selectedVerses.delete(note.selectionKey);else state.selectedVerses.set(note.selectionKey,note);
  document.querySelectorAll('.note-hit').forEach(button=>{const item=state.noteItems.get(button.dataset.noteKey);button.classList.toggle('selected',!!item&&state.selectedVerses.has(item.selectionKey))});
  updateNoteSelectionButton();updateSelectionBar();
}
function noteText(note){return`${note.context} — Nota ${visibleNoteRef(note.ref)}: ${note.text}`}
function copyActiveNote(){const note=state.activeNote;if(note)copyText(noteText(note),'Nota copiada')}
function shareActiveNote(){const note=state.activeNote;if(!note)return;const text=noteText(note);if(navigator.share)navigator.share({title:`Nota ${visibleNoteRef(note.ref)} — ${note.context}`,text}).catch(()=>{});else copyText(text,'Nota copiada')}
function copyText(text,message){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(message)};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast(message)).catch(fallback);else fallback();
}
function renderIntroduction(){
  const book=state.currentBook;if(!book?.introduction)return;
  closeNote(false);clearVerseSelection(false);$('topbar-title').textContent=`${book.book} · Introdução`;
  const sections=book.introduction.sections||[];$('reader').removeAttribute('style');
  $('reader').innerHTML=`<article class="introduction"><h2>${esc(book.introduction.title||'Introdução')}</h2>${sections.map(section=>`<section class="introduction-section">${section.title?`<h3>${esc(section.title)}</h3>`:''}${(section.paragraphs||[]).map(paragraph=>`<p>${esc(paragraph)}</p>`).join('')}</section>`).join('')}</article>`;$('reader').scrollTop=0;
}

async function openBookIntroduction(book){
  try{
    state.menuOpen.random=false;
    await loadBook(book);
    if(!book.introduction){toast('Este livro não tem introdução');return}
    state.currentBook=book;state.currentChapter=null;
    selectBookMenuGroup(book);
    state.menuOpen.book=book.book;
    renderSidebar();renderIntroduction();
    if(window.innerWidth<=700){$('sidebar').classList.remove('open');$('overlay').classList.remove('open')}
  }catch(err){toast(err.message||'Erro ao carregar introdução')}
}

function randomItem(items){return items[Math.floor(Math.random()*items.length)]}
async function openRandomPassage(scope='all'){
  try{
    const testamentChoices=CANON.filter(testament=>scope==='all'||testament.id===scope).map(testament=>({
      testament,
      books:testament.groups.flatMap(group=>group.books.map(findBookByName)).filter(bookHasContent)
    })).filter(choice=>choice.books.length);
    const choice=randomItem(testamentChoices);
    const book=randomItem(choice.books);
    await loadBook(book);
    const chapters=book.chapters.filter(chapter=>chapter.verses?.some(verse=>!verse.omitted&&String(verse.text||'').trim()));
    const chapter=randomItem(chapters);
    const validVerses=chapter.verses.filter(verse=>!verse.omitted&&String(verse.text||'').trim());
    const maxStart=Math.max(0,validVerses.length-3);
    const startIndex=Math.floor(Math.random()*(maxStart+1));
    const passage=validVerses.slice(startIndex,startIndex+3);
    const start=passage[0];
    await openChapter(book,chapter);
    setTimeout(()=>{
      const blocks=passage.map(verse=>document.querySelector(`.verse-block[data-verse="${verse.verse}"]`)).filter(Boolean);
      blocks.forEach(block=>block.classList.add('random-passage'));
      blocks[0]?.scrollIntoView({behavior:'smooth',block:'center'});
      const end=passage.at(-1)?.verse;
      toast(`Passagem aleatória: ${book.book} ${chapter.chapter},${start.verse}${end&&end!==start.verse?`-${end}`:''}`);
    },80);
  }catch(err){toast(err.message||'Não foi possível escolher uma passagem')}
}


function selectionKey(book,ch,v){return`${book}|${ch}|${v}`}
function formatVerseLine(item){return item.type==='note'?noteText(item):`${item.book} ${item.chapter},${item.verse} — ${item.text}`}
function toggleVerseSelection(block){
  if(!block)return;
  const item={
    book:block.dataset.book,
    chapter:Number(block.dataset.chapter),
    verse:Number(block.dataset.verse),
    text:block.dataset.text||''
  };
  const key=selectionKey(item.book,item.chapter,item.verse);
  if(state.selectedVerses.has(key)){
    state.selectedVerses.delete(key);
    block.classList.remove('selected');
  }else{
    state.selectedVerses.set(key,item);
    block.classList.add('selected');
  }
  updateSelectionBar();
}
function orderedSelectedVerses(){
  return Array.from(state.selectedVerses.values()).sort((a,b)=>{
    const ai=state.books.findIndex(book=>book.book===a.book);
    const bi=state.books.findIndex(book=>book.book===b.book);
    if(ai!==bi)return ai-bi;
    if(a.chapter!==b.chapter)return a.chapter-b.chapter;
    if(a.verse!==b.verse)return a.verse-b.verse;
    if(a.type===b.type)return Number(a.ref||0)-Number(b.ref||0);
    return a.type==='note'?1:-1;
  });
}
function selectedText(){
  return orderedSelectedVerses().map(formatVerseLine).join('\n');
}
function updateSelectionBar(){
  const count=state.selectedVerses.size;
  const bar=$('selection-bar');
  const label=$('selection-count');
  if(!bar||!label)return;
  const onlyVerses=Array.from(state.selectedVerses.values()).every(item=>item.type!=='note');
  label.textContent=onlyVerses?(count===1?'1 versículo selecionado':`${count} versículos selecionados`):(count===1?'1 elemento selecionado':`${count} elementos selecionados`);
  bar.classList.toggle('open',count>0);
}
function clearVerseSelection(showToast=true){
  state.selectedVerses.clear();
  document.querySelectorAll('.verse-block.selected').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('.note-hit.selected').forEach(el=>el.classList.remove('selected'));
  updateSelectionBar();
  if(showToast)toast('Seleção limpa');
}
function copySelectedVerses(){
  const text=selectedText();
  if(!text){toast('Sem versículos selecionados');return}
  navigator.clipboard?.writeText(text).then(()=>toast('Seleção copiada')).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Seleção copiada');
  });
}
function shareSelectedVerses(){
  const text=selectedText();
  if(!text){toast('Sem versículos selecionados');return}
  if(navigator.share)navigator.share({title:'Versículos selecionados',text}).catch(()=>{});
  else copySelectedVerses();
}

function copyV(book,ch,v,text){
  const full=`${book} ${ch},${v} — ${text}`;
  navigator.clipboard?.writeText(full).then(()=>toast('Copiado!')).catch(()=>{const ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copiado!')});
}
function shareV(book,ch,v,text){
  const msg=`${book} ${ch},${v} — ${text}`;
  if(navigator.share)navigator.share({title:`${book} ${ch},${v}`,text:msg}).catch(()=>{});
  else copyV(book,ch,v,text);
}

let sTimeout;
let searchRequest=0;
$('search-input').addEventListener('input',e=>{clearTimeout(sTimeout);sTimeout=setTimeout(()=>doSearch(e.target.value.trim()),250)});
async function doSearch(query){
  const results=$('search-results');
  if(!query||query.length<2){results.innerHTML='<div class="panel-empty">Introduz um termo para pesquisar.</div>';return}
  const request=++searchRequest;
  const scope=state.searchScope;
  const currentBook=state.currentBook;
  results.innerHTML='<div class="panel-empty">A pesquisar…</div>';
  if(scope==='all')await ensureAllBooksLoaded();
  else if(currentBook)await loadBook(currentBook);
  if(request!==searchRequest)return;
  const q=query.toLowerCase();const matches=[];
  const books=scope==='book'&&currentBook?[currentBook]:state.books;
  books.forEach(book=>(book.chapters||[]).forEach(ch=>(ch.verses||[]).forEach(verse=>{if(verse.text.toLowerCase().includes(q))matches.push({book,ch,verse})})));
  if(!matches.length){results.innerHTML=`<div class="panel-empty">Sem resultados para "${esc(query)}".</div>`;return}
  results.innerHTML=matches.slice(0,100).map(({book,ch,verse})=>{
    const snip=esc(verse.text.substring(0,120)).replace(new RegExp(escR(esc(query)),'gi'),m=>`<mark>${m}</mark>`);
    return`<div class="result-item" onclick="goTo('${ea(book.book)}',${ch.chapter},${verse.verse});closeSearch()">
      <span class="result-ref">${book.book} ${ch.chapter},${verse.verse}</span>
      <span class="result-snippet">${snip}…</span></div>`;
  }).join('')+(matches.length>100?`<div class="panel-empty">${matches.length} resultados — refina a pesquisa.</div>`:'');
}
function setSearchScope(scope,runSearch=true){
  state.searchScope=scope==='book'&&state.currentBook?'book':'all';
  const bookBtn=$('search-scope-book');
  const allBtn=$('search-scope-all');
  bookBtn.hidden=!state.currentBook;
  bookBtn.textContent=state.currentBook?`Neste livro (${state.currentBook.book})`:'Neste livro';
  bookBtn.classList.toggle('active',state.searchScope==='book');
  allBtn.classList.toggle('active',state.searchScope==='all');
  bookBtn.setAttribute('aria-pressed',String(state.searchScope==='book'));
  allBtn.setAttribute('aria-pressed',String(state.searchScope==='all'));
  $('search-warning').hidden=state.searchScope!=='all';
  if(runSearch)doSearch($('search-input').value.trim());
}
function openSearch(){
  clearTimeout(sTimeout);
  searchRequest++;
  setSearchScope(state.currentBook?'book':'all',false);
  $('search-panel').classList.add('open');
  $('overlay').classList.add('open');
  $('search-input').focus();
  doSearch($('search-input').value.trim());
}
async function goTo(bookName,chNum,vNum){
  const book=state.books.find(b=>b.book===bookName);if(!book)return;
  await loadBook(book);
  const ch=book.chapters.find(c=>Number(c.chapter)===Number(chNum));if(!ch)return;
  await openChapter(book,ch);
  setTimeout(()=>{const b=document.querySelector(`[data-verse="${vNum}"]`);if(b)b.scrollIntoView({behavior:'smooth',block:'center'})},80);
}

function cycleFontScale(){
  const values=[1,1.15,1.3,1.45];
  const current=state.fontScale || 1;
  const idx=values.indexOf(current);
  const next=values[(idx+1) % values.length];

  state.fontScale=next;
  applyFontScale();
  localStorage.setItem('biblia-font-scale', String(next));
  toast(`Texto ${Math.round(next*100)}%`);
}

$('menu-btn').addEventListener('click',()=>{$('sidebar').classList.toggle('open');$('overlay').classList.toggle('open')});
$('overlay').addEventListener('click',()=>{$('sidebar').classList.remove('open');closeSearch()});
$('search-btn').addEventListener('click',openSearch);
$('search-scope-book').addEventListener('click',()=>setSearchScope('book'));
$('search-scope-all').addEventListener('click',()=>setSearchScope('all'));
$('search-close').addEventListener('click',closeSearch);
function closeSearch(){clearTimeout(sTimeout);searchRequest++;$('search-panel').classList.remove('open');$('overlay').classList.remove('open')}
$('copy-selection-btn').addEventListener('click',copySelectedVerses);
$('share-selection-btn').addEventListener('click',shareSelectedVerses);
$('clear-selection-btn').addEventListener('click',()=>clearVerseSelection(true));
$('font-btn').addEventListener('click',cycleFontScale);
$('note-sheet-close').addEventListener('click',()=>closeNote(true));
$('note-overlay').addEventListener('click',event=>{if(event.target===$('note-overlay'))closeNote(true)});
$('note-select-btn').addEventListener('click',toggleActiveNoteSelection);
$('note-copy-btn').addEventListener('click',copyActiveNote);
$('note-share-btn').addEventListener('click',shareActiveNote);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('note-overlay').classList.contains('open'))closeNote(true)});
$('theme-btn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';localStorage.setItem('biblia-theme',dark?'light':'dark')});
if(localStorage.getItem('biblia-theme')==='dark')document.documentElement.dataset.theme='dark';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ea(s){return String(s).replace(/'/g,"\\'").replace(/\n/g,' ')}
function escR(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function goHomeFromLogo(){
  renderHome();
  renderSidebar();
  $('sidebar').classList.remove('open');
  $('search-panel').classList.remove('open');
  $('overlay').classList.remove('open');
}
$('topbar-logo').addEventListener('click',goHomeFromLogo);
$('sidebar-logo').addEventListener('click',goHomeFromLogo);

const splashStarted=performance.now();
function hideSplash(){
  const elapsed=performance.now()-splashStarted;
  setTimeout(()=>{$('splash').classList.add('hidden')},Math.max(0,650-elapsed));
}
loadData().catch(err=>{$('reader').innerHTML=`<p style="color:var(--red);padding:20px">Erro: ${err.message}</p>`}).finally(hideSplash);
</script>
