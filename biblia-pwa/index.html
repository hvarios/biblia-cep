<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3d2b1f">
  <title>Bíblia CEP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── VARIÁVEIS ────────────────────────────────────────── */
    :root {
      --bg:        #f5efe0;
      --bg2:       #ede5cf;
      --bg3:       #e2d8c0;
      --ink:       #2a1a0e;
      --ink2:      #5c3d20;
      --ink3:      #8a6540;
      --gold:      #8b6200;
      --gold-lt:   #c49a2a;
      --red:       #8b1a1a;
      --border:    rgba(90,55,20,0.18);
      --shadow:    rgba(42,26,14,0.12);
      --radius:    6px;
      --font-body: 'EB Garamond', Georgia, serif;
      --font-ui:   'Cormorant SC', serif;
      --sidebar-w: 280px;
      --topbar-h:  52px;
    }
    [data-theme="dark"] {
      --bg:      #1a1108;
      --bg2:     #251a0c;
      --bg3:     #2f2010;
      --ink:     #f0e8d0;
      --ink2:    #c8a870;
      --ink3:    #8a7050;
      --gold:    #c49a2a;
      --gold-lt: #e8c060;
      --red:     #c05050;
      --border:  rgba(200,168,112,0.15);
      --shadow:  rgba(0,0,0,0.4);
    }

    /* ── RESET ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      font-size: 18px;
      line-height: 1.7;
      transition: background .3s, color .3s;
    }

    /* ── LAYOUT ───────────────────────────────────────────── */
    #app { display: flex; height: 100vh; }

    /* Topbar (mobile) */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px;
      z-index: 200;
      box-shadow: 0 2px 8px var(--shadow);
    }
    #topbar h1 {
      font-family: var(--font-ui);
      font-size: 1.05rem;
      letter-spacing: .06em;
      color: var(--ink2);
      flex: 1;
      text-align: center;
    }
    .topbar-btn {
      background: none; border: none; cursor: pointer;
      color: var(--ink2); padding: 6px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .topbar-btn:hover { background: var(--bg3); }
    .topbar-btn svg { width: 22px; height: 22px; }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0;
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 100;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-header h2 {
      font-family: var(--font-ui);
      font-size: 1.15rem;
      letter-spacing: .1em;
      color: var(--ink);
      margin-bottom: 4px;
    }
    #sidebar-header p {
      font-size: .8rem;
      color: var(--ink3);
      font-style: italic;
    }
    #book-list {
      flex: 1; overflow-y: auto;
      padding: 8px 0;
    }
    .book-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 18px;
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: .95rem;
      letter-spacing: .04em;
      color: var(--ink2);
      transition: background .15s;
      border-left: 3px solid transparent;
    }
    .book-item:hover { background: var(--bg3); }
    .book-item.active {
      border-left-color: var(--gold);
      color: var(--ink);
      background: var(--bg3);
    }
    .book-item .badge {
      font-size: .7rem; color: var(--ink3);
      font-family: var(--font-body);
    }
    .chapter-grid {
      display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 4px; padding: 8px 18px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .ch-btn {
      background: none; border: 1px solid var(--border);
      border-radius: 3px; padding: 4px;
      font-family: var(--font-ui); font-size: .8rem;
      color: var(--ink3); cursor: pointer;
      transition: all .15s;
    }
    .ch-btn:hover { background: var(--bg3); color: var(--ink); }
    .ch-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }

    /* Main content */
    #main {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden;
      padding-top: var(--topbar-h);
    }
    #reader {
      flex: 1; overflow-y: auto;
      padding: 28px 32px 60px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── TYPOGRAFIA ───────────────────────────────────────── */
    #chapter-heading {
      font-family: var(--font-ui);
      font-size: 1.5rem;
      letter-spacing: .15em;
      color: var(--ink2);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    #book-heading {
      font-size: .85rem;
      color: var(--gold);
      font-family: var(--font-ui);
      letter-spacing: .1em;
      margin-bottom: 28px;
      text-transform: uppercase;
    }
    .verse-block {
      margin-bottom: 10px;
      padding: 6px 0;
      border-bottom: 1px solid transparent;
      transition: background .15s;
      border-radius: 3px;
    }
    .verse-block:hover { background: var(--bg2); padding: 6px 8px; margin: 0 -8px 10px; }
    .verse-num {
      font-family: var(--font-ui);
      font-size: .72rem;
      color: var(--gold);
      vertical-align: super;
      margin-right: 4px;
      letter-spacing: .03em;
      user-select: none;
    }
    .verse-text { font-size: 1.1rem; line-height: 1.8; }
    .note-marker {
      color: var(--red);
      font-size: .72rem;
      vertical-align: super;
      cursor: pointer;
      font-family: var(--font-ui);
      text-decoration: none;
      margin-left: 1px;
      transition: color .15s;
    }
    .note-marker:hover { color: var(--gold); }

    /* Notas inline */
    .note-popup {
      display: none;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--red);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin: 6px 0 4px 16px;
      font-size: .88rem;
      line-height: 1.65;
      color: var(--ink2);
      font-style: italic;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .note-popup.open { display: block; animation: fadeIn .15s ease; }
    .note-label {
      font-family: var(--font-ui); font-style: normal;
      font-size: .75rem; color: var(--red);
      margin-bottom: 4px; display: block;
    }

    /* Anotação do utilizador */
    .annotation-block {
      display: none;
      margin: 4px 0 8px 16px;
    }
    .annotation-block.open { display: block; }
    .annotation-text {
      background: var(--bg3);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: .88rem;
      color: var(--ink2);
      font-style: italic;
      margin-bottom: 4px;
      white-space: pre-wrap;
    }
    .annotation-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-family: var(--font-body);
      font-size: .9rem;
      color: var(--ink);
      resize: vertical;
      min-height: 72px;
    }
    .annotation-input:focus { outline: none; border-color: var(--gold); }
    .annotation-actions { display: flex; gap: 8px; margin-top: 6px; }
    .btn-sm {
      background: none; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px 12px;
      font-family: var(--font-ui); font-size: .78rem;
      color: var(--ink2); cursor: pointer;
      transition: all .15s; letter-spacing: .04em;
    }
    .btn-sm:hover { background: var(--bg3); }
    .btn-sm.primary { background: var(--gold); border-color: var(--gold); color: #fff; }
    .btn-sm.primary:hover { background: var(--gold-lt); }
    .btn-sm.danger { color: var(--red); border-color: var(--red); }

    /* Toolbar do versículo (on hover) */
    .verse-tools {
      display: none; gap: 6px; margin-top: 4px; padding-left: 16px;
    }
    .verse-block:hover .verse-tools { display: flex; }

    /* ── PAINEL DE PESQUISA ───────────────────────────────── */
    #search-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(380px, 100vw);
      background: var(--bg2);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 20px var(--shadow);
      z-index: 300;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    #search-panel.open { transform: translateX(0); }
    #search-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    #search-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
    }
    #search-input:focus { outline: none; border-color: var(--gold); }
    #search-results { flex: 1; overflow-y: auto; padding: 8px 0; }
    .result-item {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
    }
    .result-item:hover { background: var(--bg3); }
    .result-ref {
      font-family: var(--font-ui); font-size: .78rem;
      color: var(--gold); display: block; margin-bottom: 3px;
    }
    .result-snippet { font-size: .9rem; line-height: 1.5; color: var(--ink2); }
    .result-snippet mark {
      background: transparent; color: var(--red); font-weight: 600;
    }
    #search-empty {
      padding: 32px 16px; text-align: center;
      color: var(--ink3); font-style: italic; font-size: .95rem;
    }

    /* ── PAINEL DE ANOTAÇÕES ──────────────────────────────── */
    #notes-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(420px, 100vw);
      background: var(--bg2);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 20px var(--shadow);
      z-index: 300;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    #notes-panel.open { transform: translateX(0); }
    #notes-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    #notes-header h3 { font-family: var(--font-ui); font-size: 1rem; letter-spacing: .08em; }
    #notes-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .note-entry {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
    }
    .note-entry:hover { background: var(--bg3); }
    .note-entry-ref {
      font-family: var(--font-ui); font-size: .78rem;
      color: var(--gold); display: block; margin-bottom: 4px;
    }
    .note-entry-text { font-size: .9rem; color: var(--ink2); font-style: italic; }
    #notes-export {
      padding: 12px 16px; border-top: 1px solid var(--border);
    }

    /* ── OVERLAY ──────────────────────────────────────────── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); z-index: 150;
    }
    #overlay.open { display: block; }

    /* ── ANIMAÇÕES ────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

    /* ── RESPONSIVO ───────────────────────────────────────── */
    @media (max-width: 700px) {
      #sidebar {
        position: fixed; top: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px var(--shadow);
      }
      #sidebar.open { transform: translateX(0); }
      #main { padding-top: var(--topbar-h); }
      #reader { padding: 20px 16px 60px; }
      .verse-tools { display: none !important; }
    }
    @media (min-width: 701px) {
      #topbar { left: var(--sidebar-w); }
      #menu-btn { display: none; }
      #sidebar { position: relative; }
    }

    /* ── SCROLLBAR ────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── TOAST ────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--bg);
      padding: 8px 20px; border-radius: 20px;
      font-size: .85rem; font-family: var(--font-ui);
      letter-spacing: .05em; z-index: 999;
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <button class="topbar-btn" id="menu-btn" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <h1 id="topbar-title">Bíblia CEP</h1>
  <button class="topbar-btn" id="search-btn" title="Pesquisar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>
  <button class="topbar-btn" id="notes-btn" title="Anotações">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
  </button>
  <button class="topbar-btn" id="theme-btn" title="Tema">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>

<!-- OVERLAY -->
<div id="overlay"></div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div id="sidebar-header">
      <h2>Bíblia CEP</h2>
      <p>Conferência Episcopal Portuguesa</p>
    </div>
    <div id="book-list"></div>
  </nav>

  <!-- MAIN -->
  <main id="main">
    <div id="reader">
      <div id="book-heading"></div>
      <div id="chapter-heading"></div>
      <div id="verses-container"></div>
    </div>
  </main>

</div>

<!-- PAINEL PESQUISA -->
<div id="search-panel">
  <div id="search-header">
    <input id="search-input" type="search" placeholder="Pesquisar palavras ou frases…" autocomplete="off">
    <button class="topbar-btn" id="search-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="search-results"><div id="search-empty">Introduz um termo para pesquisar.</div></div>
</div>

<!-- PAINEL ANOTAÇÕES -->
<div id="notes-panel">
  <div id="notes-header">
    <h3>As Minhas Anotações</h3>
    <button class="topbar-btn" id="notes-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="notes-list"></div>
  <div id="notes-export">
    <button class="btn-sm" id="export-btn" style="width:100%">Exportar Anotações</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';

// ── ESTADO ──────────────────────────────────────────────────
const state = {
  books: [],
  currentBook: null,
  currentChapter: null,
  annotations: JSON.parse(localStorage.getItem('biblia-annotations') || '{}'),
};

// ── UTILITÁRIOS ──────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

function toast(msg, dur = 2200) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function saveAnnotations() {
  localStorage.setItem('biblia-annotations', JSON.stringify(state.annotations));
}

function annotationKey(bookName, chapterNum, verseNum) {
  return `${bookName}|${chapterNum}|${verseNum}`;
}

// ── SERVICE WORKER ───────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ── CARREGAR DADOS ───────────────────────────────────────────
async function loadData() {
  const res = await fetch('./data/coelet.json');
  const coelet = await res.json();
  state.books = [coelet];
  renderSidebar();
  // Abrir primeiro capítulo por defeito
  openChapter(coelet, coelet.chapters[0]);
}

// ── SIDEBAR ──────────────────────────────────────────────────
function renderSidebar() {
  const list = $('book-list');
  list.innerHTML = '';

  state.books.forEach(book => {
    const item = document.createElement('div');
    item.className = 'book-item' + (state.currentBook === book ? ' active' : '');
    item.innerHTML = `
      <span>${book.book}</span>
      <span class="badge">${book.chapters.length} cap.</span>
    `;
    item.addEventListener('click', () => toggleBookChapters(book, item));
    list.appendChild(item);

    // Grid de capítulos (começa fechada)
    const grid = document.createElement('div');
    grid.className = 'chapter-grid';
    grid.style.display = state.currentBook === book ? 'grid' : 'none';
    book.chapters.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'ch-btn' + (state.currentChapter === ch ? ' active' : '');
      btn.textContent = ch.chapter;
      btn.addEventListener('click', e => { e.stopPropagation(); openChapter(book, ch); });
      grid.appendChild(btn);
    });
    list.appendChild(grid);
  });
}

function toggleBookChapters(book, itemEl) {
  const grid = itemEl.nextSibling;
  const isOpen = grid.style.display === 'grid';
  grid.style.display = isOpen ? 'none' : 'grid';
  itemEl.classList.toggle('active', !isOpen);
}

// ── ABRIR CAPÍTULO ───────────────────────────────────────────
function openChapter(book, chapter) {
  state.currentBook = book;
  state.currentChapter = chapter;

  // Atualizar topbar
  $('topbar-title').textContent = `${book.book} ${chapter.chapter}`;

  // Atualizar sidebar
  renderSidebar();

  // Expandir o livro na sidebar
  const list = $('book-list');
  const items = list.querySelectorAll('.book-item');
  items.forEach((item, i) => {
    if (state.books[i] === book) {
      const grid = item.nextSibling;
      grid.style.display = 'grid';
      item.classList.add('active');
    }
  });

  // Render versículos
  renderChapter(book, chapter);

  // Fechar sidebar no mobile
  if (window.innerWidth <= 700) {
    $('sidebar').classList.remove('open');
    $('overlay').classList.remove('open');
  }

  // Scroll ao topo
  $('reader').scrollTop = 0;
}

// ── RENDER CAPÍTULO ──────────────────────────────────────────
function renderChapter(book, chapter) {
  $('book-heading').textContent = book.book.toUpperCase();
  $('chapter-heading').textContent = `Capítulo ${chapter.chapter}`;

  const container = $('verses-container');
  container.innerHTML = '';

  chapter.verses.forEach(verse => {
    const key = annotationKey(book.book, chapter.chapter, verse.verse);
    const hasAnnotation = !!state.annotations[key];

    const block = document.createElement('div');
    block.className = 'verse-block';
    block.dataset.key = key;
    block.dataset.verse = verse.verse;

    // Construir texto com marcadores de nota
    let textHtml = `<span class="verse-num">${verse.verse}</span>`;
    let remaining = verse.text;

    if (verse.note_refs && verse.note_refs.length && verse.notes) {
      // Inserir marcadores no texto (simplificado: no final de cada frase relevante)
      textHtml += `<span class="verse-text">${escapeHtml(verse.text)}`;
      verse.note_refs.forEach(ref => {
        textHtml += `<a class="note-marker" data-note="${ref}" title="Nota ${ref}">${ref}</a>`;
      });
      textHtml += `</span>`;
    } else {
      textHtml += `<span class="verse-text">${escapeHtml(verse.text)}</span>`;
    }

    // Notas popup
    let notesHtml = '';
    if (verse.notes) {
      Object.entries(verse.notes).forEach(([ref, text]) => {
        notesHtml += `
          <div class="note-popup" id="note-${key}-${ref}">
            <span class="note-label">Nota ${ref}</span>
            ${escapeHtml(text)}
          </div>`;
      });
    }

    // Anotação do utilizador
    const annText = state.annotations[key] || '';
    const annotationHtml = `
      <div class="annotation-block ${hasAnnotation ? 'open' : ''}" id="ann-block-${key}">
        ${hasAnnotation
          ? `<div class="annotation-text" id="ann-text-${key}">${escapeHtml(annText)}</div>`
          : ''}
        <textarea class="annotation-input" id="ann-input-${key}" 
          placeholder="A tua anotação para ${book.book} ${chapter.chapter},${verse.verse}…"
          style="display:none">${escapeHtml(annText)}</textarea>
        <div class="annotation-actions" id="ann-actions-${key}" style="display:none">
          <button class="btn-sm primary" onclick="saveAnnotation('${key}')">Guardar</button>
          <button class="btn-sm" onclick="cancelAnnotation('${key}')">Cancelar</button>
          ${hasAnnotation ? `<button class="btn-sm danger" onclick="deleteAnnotation('${key}')">Apagar</button>` : ''}
        </div>
      </div>`;

    // Tools
    const toolsHtml = `
      <div class="verse-tools">
        <button class="btn-sm" onclick="copyVerse('${key}', '${escapeAttr(verse.text)}')">Copiar</button>
        <button class="btn-sm" onclick="shareVerse('${key}', '${escapeAttr(book.book)}', ${chapter.chapter}, ${verse.verse}, '${escapeAttr(verse.text)}')">Partilhar</button>
        <button class="btn-sm" onclick="editAnnotation('${key}')">Anotar</button>
      </div>`;

    block.innerHTML = textHtml + notesHtml + annotationHtml + toolsHtml;
    container.appendChild(block);
  });

  // Event listeners para notas
  container.querySelectorAll('.note-marker').forEach(marker => {
    marker.addEventListener('click', e => {
      e.preventDefault();
      const key = marker.closest('.verse-block').dataset.key;
      const ref = marker.dataset.note;
      const popup = $(`note-${key}-${ref}`);
      if (popup) popup.classList.toggle('open');
    });
  });
}

// ── ANOTAÇÕES ────────────────────────────────────────────────
function editAnnotation(key) {
  const block = $(`ann-block-${key}`);
  const input = $(`ann-input-${key}`);
  const actions = $(`ann-actions-${key}`);
  const textEl = $(`ann-text-${key}`);
  block.classList.add('open');
  if (textEl) textEl.style.display = 'none';
  input.style.display = 'block';
  actions.style.display = 'flex';
  input.focus();
}

function saveAnnotation(key) {
  const input = $(`ann-input-${key}`);
  const text = input.value.trim();
  if (text) {
    state.annotations[key] = text;
    saveAnnotations();
    toast('Anotação guardada');
  } else {
    delete state.annotations[key];
    saveAnnotations();
  }
  // Re-render o bloco
  openChapter(state.currentBook, state.currentChapter);
  // Scroll de volta ao versículo
  setTimeout(() => {
    const block = document.querySelector(`[data-key="${key}"]`);
    if (block) block.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

function cancelAnnotation(key) {
  const block = $(`ann-block-${key}`);
  const input = $(`ann-input-${key}`);
  const actions = $(`ann-actions-${key}`);
  const textEl = $(`ann-text-${key}`);
  input.style.display = 'none';
  actions.style.display = 'none';
  if (textEl) textEl.style.display = 'block';
  if (!state.annotations[key]) block.classList.remove('open');
}

function deleteAnnotation(key) {
  if (!confirm('Apagar esta anotação?')) return;
  delete state.annotations[key];
  saveAnnotations();
  openChapter(state.currentBook, state.currentChapter);
  toast('Anotação apagada');
}

// ── COPIAR / PARTILHAR ───────────────────────────────────────
function copyVerse(key, text) {
  const [book, ch, v] = key.split('|');
  const full = `${book} ${ch},${v} — ${text}`;
  navigator.clipboard.writeText(full).then(() => toast('Copiado!')).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = full;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('Copiado!');
  });
}

function shareVerse(key, book, ch, v, text) {
  const msg = `${book} ${ch},${v} — ${text}`;
  if (navigator.share) {
    navigator.share({ title: `${book} ${ch},${v}`, text: msg }).catch(() => {});
  } else {
    copyVerse(key, text);
  }
}

// ── PESQUISA ─────────────────────────────────────────────────
let searchTimeout;
$('search-input').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doSearch(e.target.value.trim()), 250);
});

function doSearch(query) {
  const results = $('search-results');
  if (!query || query.length < 2) {
    results.innerHTML = '<div id="search-empty">Introduz um termo para pesquisar.</div>';
    return;
  }
  const q = query.toLowerCase();
  const matches = [];
  state.books.forEach(book => {
    book.chapters.forEach(ch => {
      ch.verses.forEach(verse => {
        if (verse.text.toLowerCase().includes(q)) {
          matches.push({ book, ch, verse, q });
        }
      });
    });
  });

  if (!matches.length) {
    results.innerHTML = '<div id="search-empty">Sem resultados.</div>';
    return;
  }

  results.innerHTML = matches.map(({ book, ch, verse, q }) => {
    const snippet = highlightText(verse.text, q);
    return `<div class="result-item" 
      onclick="goToVerse('${book.book}',${ch.chapter},${verse.verse});closeSearch()">
      <span class="result-ref">${book.book} ${ch.chapter},${verse.verse}</span>
      <span class="result-snippet">${snippet}</span>
    </div>`;
  }).join('');
}

function highlightText(text, q) {
  const safe = escapeHtml(text);
  const re = new RegExp(escapeRegex(escapeHtml(q)), 'gi');
  return safe.replace(re, m => `<mark>${m}</mark>`);
}

function goToVerse(bookName, chNum, verseNum) {
  const book = state.books.find(b => b.book === bookName);
  if (!book) return;
  const ch = book.chapters.find(c => c.chapter === chNum);
  if (!ch) return;
  openChapter(book, ch);
  setTimeout(() => {
    const block = document.querySelector(`[data-verse="${verseNum}"]`);
    if (block) block.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

// ── PAINEL ANOTAÇÕES ─────────────────────────────────────────
function renderNotesPanel() {
  const list = $('notes-list');
  const keys = Object.keys(state.annotations);
  if (!keys.length) {
    list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--ink3);font-style:italic;font-size:.9rem">Ainda não tens anotações.</div>';
    return;
  }
  list.innerHTML = keys.map(key => {
    const [book, ch, v] = key.split('|');
    const text = state.annotations[key];
    return `<div class="note-entry" onclick="goToVerse('${book}',${ch},${v});closeNotes()">
      <span class="note-entry-ref">${book} ${ch},${v}</span>
      <span class="note-entry-text">${escapeHtml(text.substring(0, 120))}${text.length > 120 ? '…' : ''}</span>
    </div>`;
  }).join('');
}

$('export-btn').addEventListener('click', () => {
  const keys = Object.keys(state.annotations);
  if (!keys.length) { toast('Sem anotações para exportar'); return; }
  const lines = keys.map(key => {
    const [book, ch, v] = key.split('|');
    return `## ${book} ${ch},${v}\n${state.annotations[key]}`;
  });
  const content = `# Anotações Bíblicas\n\n${lines.join('\n\n')}`;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'anotacoes-biblia.txt';
  a.click(); URL.revokeObjectURL(url);
  toast('Anotações exportadas');
});

// ── CONTROLOS UI ─────────────────────────────────────────────
$('menu-btn').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('overlay').classList.toggle('open');
});

$('overlay').addEventListener('click', () => {
  $('sidebar').classList.remove('open');
  $('search-panel').classList.remove('open');
  $('notes-panel').classList.remove('open');
  $('overlay').classList.remove('open');
});

$('search-btn').addEventListener('click', () => {
  $('search-panel').classList.add('open');
  $('notes-panel').classList.remove('open');
  $('overlay').classList.add('open');
  $('search-input').focus();
});

$('search-close').addEventListener('click', closeSearch);
function closeSearch() {
  $('search-panel').classList.remove('open');
  $('overlay').classList.remove('open');
}

$('notes-btn').addEventListener('click', () => {
  renderNotesPanel();
  $('notes-panel').classList.add('open');
  $('search-panel').classList.remove('open');
  $('overlay').classList.add('open');
});

$('notes-close').addEventListener('click', closeNotes);
function closeNotes() {
  $('notes-panel').classList.remove('open');
  $('overlay').classList.remove('open');
}

$('theme-btn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = dark ? '' : 'dark';
  localStorage.setItem('biblia-theme', dark ? 'light' : 'dark');
});

// Restaurar tema
if (localStorage.getItem('biblia-theme') === 'dark') {
  document.documentElement.dataset.theme = 'dark';
}

// ── HELPERS ───────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function escapeAttr(str) {
  return String(str).replace(/'/g, "\\'").replace(/\n/g, ' ');
}
function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// ── INIT ──────────────────────────────────────────────────────
loadData().catch(err => {
  $('verses-container').innerHTML = `<p style="color:var(--red);padding:20px">Erro ao carregar dados: ${err.message}</p>`;
});
</script>
